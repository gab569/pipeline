name: CI/CD Learning Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================================
  # JOB 1: CHECKOUT
  # =========================================================
  checkout:
    name: Checkout Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: echo "Checking out application repository..."


  # =========================================================
  # JOB 2: UNIT TEST
  # =========================================================
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Run unit tests
        run: echo "Running unit tests..."


  # =========================================================
  # JOB 3: SECRET SCAN
  # =========================================================
  secret-scan:
    name: Scan Repository for Secrets
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Scan repository
        run: echo "Scanning repository to make sure no secrets are committed..."


  # =========================================================
  # JOB 4: VAULT AUTHENTICATION
  # =========================================================
  vault-auth:
    name: Authenticate to Vault
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Authenticate to Vault
        run: echo "Authenticating to HashiCorp Vault..."


  # =========================================================
  # JOB 5: BUILD IMAGE
  # =========================================================
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: vault-auth

    steps:
      - name: Build Docker image
        run: echo "Building Docker image..."


  # =========================================================
  # JOB 6: SCAN IMAGE
  # =========================================================
  scan-image:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Scan Docker image
        run: echo "Scanning Docker image for vulnerabilities..."


  # =========================================================
  # JOB 7: AWS ECR AUTHENTICATION
  # =========================================================
  ecr-auth:
    name: Authenticate to AWS ECR
    runs-on: ubuntu-latest
    needs: scan-image

    steps:
      - name: Authenticate to AWS ECR
        run: echo "Authenticating to AWS ECR..."


  # =========================================================
  # JOB 8: PUSH IMAGE TO ECR
  # =========================================================
  push-image:
    name: Push Image to AWS ECR
    runs-on: ubuntu-latest
    needs: ecr-auth

    steps:
      - name: Push Docker image
        run: echo "Pushing Docker image to AWS ECR..."


  # =========================================================
  # JOB 9: CLONE DEPLOYMENT REPOSITORY
  # =========================================================
  clone-deployment-repo:
    name: Clone Deployment Repository
    runs-on: ubuntu-latest
    needs: push-image

    steps:
      - name: Clone deployment repository
        run: echo "Cloning the Kubernetes deployment repository..."


  # =========================================================
  # JOB 10: UPDATE IMAGE
  # =========================================================
  update-image:
    name: Update Deployment Image
    runs-on: ubuntu-latest
    needs: clone-deployment-repo

    steps:
      - name: Update image
        run: echo "Substituting the old image with the newly built image..."


  # =========================================================
  # JOB 11: PUSH DEPLOYMENT CHANGES
  # =========================================================
  push-deployment:
    name: Push Deployment Changes
    runs-on: ubuntu-latest
    needs: update-image

    steps:
      - name: Push deployment changes
        run: echo "Pushing updated deployment manifest back to the deployment repository..."


  # =========================================================
  # JOB 12: SYNC ARGOCD
  # =========================================================
  argocd-sync:
    name: Sync ArgoCD
    runs-on: ubuntu-latest
    needs: push-deployment

    steps:
      - name: Sync ArgoCD
        run: echo "Synchronizing the application with ArgoCD..."
