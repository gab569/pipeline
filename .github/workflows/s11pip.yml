name: CI/CD Learning Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================================
  # JOB 1: CHECKOUT
  # =========================================================
  checkout:
    name: Checkout Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        run: echo "Checking out application repository..."


  # =========================================================
  # JOB 2: UNIT TEST
  # Runs after checkout
  # =========================================================
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Run Unit Tests
        run: echo "Running unit tests..."


  # =========================================================
  # JOB 3: SECRET SCAN
  # Runs in PARALLEL with Unit Test
  # =========================================================
  secret-scan:
    name: Scan Repository for Secrets
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Scan Repository
        run: echo "Scanning repository for exposed secrets..."


  # =========================================================
  # JOB 4: BUILD IMAGE
  # Waits for BOTH Unit Test and Secret Scan
  # =========================================================
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - unit-test
      - secret-scan

    steps:
      - name: Build Docker Image
        run: echo "Building Docker image..."


  # =========================================================
  # JOB 5: SCAN IMAGE
  # =========================================================
  scan-image:
    name: Scan Docker Image
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Scan Docker Image
        run: echo "Scanning Docker image for vulnerabilities..."


  # =========================================================
  # JOB 6: VAULT AUTHENTICATION
  # =========================================================
  vault-auth:
    name: Authenticate to Vault
    runs-on: ubuntu-latest
    needs: scan-image

    steps:
      - name: Authenticate to Vault
        run: echo "Authenticating to HashiCorp Vault..."


  # =========================================================
  # JOB 7: AWS ECR AUTHENTICATION
  # =========================================================
  ecr-auth:
    name: Authenticate to AWS ECR
    runs-on: ubuntu-latest
    needs: vault-auth

    steps:
      - name: Authenticate to AWS ECR
        run: echo "Authenticating to AWS ECR..."


  # =========================================================
  # JOB 8: PUSH IMAGE
  # =========================================================
  push-image:
    name: Push Image to AWS ECR
    runs-on: ubuntu-latest
    needs: ecr-auth

    steps:
      - name: Push Image
        run: echo "Pushing Docker image to AWS ECR..."


  # =========================================================
  # JOB 9: CLONE DEPLOYMENT REPOSITORY
  # =========================================================
  clone-deployment-repo:
    name: Clone Deployment Repository
    runs-on: ubuntu-latest
    needs: push-image

    steps:
      - name: Clone Deployment Repository
        run: echo "Cloning deployment repository..."


  # =========================================================
  # JOB 10: UPDATE IMAGE
  # =========================================================
  update-image:
    name: Update Deployment Image
    runs-on: ubuntu-latest
    needs: clone-deployment-repo

    steps:
      - name: Update Deployment Image
        run: echo "Replacing the old image with the newly built image..."


  # =========================================================
  # JOB 11: PUSH DEPLOYMENT CHANGES
  # =========================================================
  push-deployment:
    name: Push Deployment Changes
    runs-on: ubuntu-latest
    needs: update-image

    steps:
      - name: Push Deployment Changes
        run: echo "Pushing updated deployment files back to the deployment repository..."


  # =========================================================
  # JOB 12: ARGOCD SYNC
  # =========================================================
  argocd-sync:
    name: Sync ArgoCD
    runs-on: ubuntu-latest
    needs: push-deployment

    steps:
      - name: Sync ArgoCD
        run: echo "Synchronizing application with ArgoCD..."
