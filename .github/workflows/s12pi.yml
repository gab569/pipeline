name: CI/CD Learning Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================================
  # JOB 1: CHECKOUT REPOSITORY
  # =========================================================
  checkout:
    name: Checkout Repository
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Show current working directory
      - name: Show Current Directory
        run: pwd

      # Step 3: List repository contents
      - name: List Repository Contents
        run: ls -la


  # # ============================================================
  # 2. DOCKER & DOCKER COMPOSE SETUP AND VALIDATION
  # ============================================================
  docker-setup:
    name: 02 - Docker & Docker Compose Setup
    runs-on: ubuntu-latest
    needs: checkout

    steps:

      # --------------------------------------------------------
      # Check Docker
      # --------------------------------------------------------
      - name: Check Docker
        run: |
          echo "Checking Docker installation..."

          if command -v docker >/dev/null 2>&1; then
            echo "Docker is already installed."
            docker --version
          else
            echo "Docker is NOT installed."
            echo "Installing Docker..."

            sudo apt-get update
            sudo apt-get install -y docker.io

            echo "Docker installation completed."
            docker --version
          fi


      # --------------------------------------------------------
      # Check Docker Compose
      # --------------------------------------------------------
      - name: Check Docker Compose
        run: |
          echo "Checking Docker Compose installation..."

          if docker compose version >/dev/null 2>&1; then
            echo "Docker Compose is already installed."
            docker compose version
          else
            echo "Docker Compose is NOT installed."
            echo "Installing Docker Compose..."

            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin

            echo "Docker Compose installation completed."
            docker compose version
          fi


      # --------------------------------------------------------
      # Verify Docker
      # --------------------------------------------------------
      - name: Verify Docker
        run: |
          echo "Docker Version:"
          docker --version

          echo ""
          echo "Docker Engine Information:"
          docker info


      # --------------------------------------------------------
      # Verify Docker Compose
      # --------------------------------------------------------
      - name: Verify Docker Compose
        run: |
          echo "Docker Compose Version:"
          docker compose version


      # --------------------------------------------------------
      # Pull Public Image
      # --------------------------------------------------------
      - name: Pull Test Docker Image
        run: |
          echo "Pulling hello-world image from Docker Hub..."

          docker pull hello-world:latest

          echo "Image pulled successfully."


      # --------------------------------------------------------
      # List Docker Images
      # --------------------------------------------------------
      - name: List Docker Images
        run: |
          echo "Docker images currently available:"
          docker images


      # --------------------------------------------------------
      # Run Test Container
      # --------------------------------------------------------
      - name: Test Docker
        run: |
          echo "Running hello-world container..."

          docker run --rm hello-world

          echo "Docker test completed successfully."


      # --------------------------------------------------------
      # Final Docker Environment Validation
      # --------------------------------------------------------
      - name: Docker Environment Summary
        run: |
          echo "========================================"
          echo "Docker Environment Summary"
          echo "========================================"

          echo ""
          echo "Docker:"
          docker --version

          echo ""
          echo "Docker Compose:"
          docker compose version

          echo ""
          echo "Available Docker Images:"
          docker images

          echo ""
          echo "Docker and Docker Compose are ready."

  # =========================================================
  # JOB 3: BUILD APPLICATION IMAGES
  # =========================================================
  build-images:
    name: 03 - Build Application Images
    runs-on: ubuntu-latest
    needs: docker-setup
    permissions:
      contents: read

    defaults:
      run:
        working-directory: k8s-learning-app

    steps:
      # Each job has its own runner, so checkout is required here too.
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build --tag "k8s-learn-api:${GITHUB_SHA}" ./backend

      - name: Build Frontend Image
        run: docker build --tag "k8s-learn-web:${GITHUB_SHA}" ./frontend

      - name: Verify Application Images
        run: |
          docker image inspect "k8s-learn-api:${GITHUB_SHA}" --format '{{.RepoTags}} {{.Id}}'
          docker image inspect "k8s-learn-web:${GITHUB_SHA}" --format '{{.RepoTags}} {{.Id}}'

      - name: List Built Application Images
        run: |
          docker image ls --filter "reference=k8s-learn-api:${GITHUB_SHA}" --filter "reference=k8s-learn-web:${GITHUB_SHA}"
