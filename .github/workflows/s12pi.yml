
name: CI/CD Learning Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  # JOB 1: CHECKOUT
  checkout:
    name: 01 - Checkout Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Current Directory
        run: pwd

      - name: List Repository Contents
        run: ls -la

  # JOB 2: DOCKER ENVIRONMENT
  docker-setup:
    name: 02 - Docker Setup and Verification
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Check and Install Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          docker --version

      - name: Check Docker Compose
        run: |
          if ! docker compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker-compose-plugin
          fi
          docker compose version

      - name: Verify Docker Engine
        run: docker info

      - name: Pull Test Image
        run: docker pull hello-world:latest

      - name: List Docker Images
        run: docker images

      - name: Run Test Container
        run: docker run --rm hello-world

  # JOB 3: BUILD APPLICATION IMAGES
  build-images:
    name: 03 - Build Application Images
    runs-on: ubuntu-latest
    needs: docker-setup
    permissions:
      contents: read

    defaults:
      run:
        working-directory: k8s-learning-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t "k8s-learn-api:${GITHUB_SHA}" \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t "k8s-learn-web:${GITHUB_SHA}" \
            ./frontend

      - name: Verify Application Images
        run: |
          docker image inspect "k8s-learn-api:${GITHUB_SHA}"
          docker image inspect "k8s-learn-web:${GITHUB_SHA}"

      - name: List Built Images
        run: docker images

  # JOB 4: AUTHENTICATE, TAG AND PUSH TO GHCR
  publish-images:
    name: 04 - Publish Images to GHCR
    runs-on: ubuntu-latest
    needs: build-images

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: k8s-learning-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare GHCR Image Names
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')

          echo "API_IMAGE=ghcr.io/${OWNER}/k8s-learn-api" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${OWNER}/k8s-learn-web" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
            -t "k8s-learn-api:${GITHUB_SHA}" \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t "k8s-learn-web:${GITHUB_SHA}" \
            ./frontend

      - name: Tag Backend Image
        run: |
          docker tag \
            "k8s-learn-api:${GITHUB_SHA}" \
            "${API_IMAGE}:${GITHUB_SHA}"

      - name: Tag Frontend Image
        run: |
          docker tag \
            "k8s-learn-web:${GITHUB_SHA}" \
            "${WEB_IMAGE}:${GITHUB_SHA}"

      - name: List Tagged Images
        run: docker images

      - name: Push Backend Image to GHCR
        run: docker push "${API_IMAGE}:${GITHUB_SHA}"

      - name: Push Frontend Image to GHCR
        run: docker push "${WEB_IMAGE}:${GITHUB_SHA}"

      - name: Verify Published Images
        run: |
          docker manifest inspect "${API_IMAGE}:${GITHUB_SHA}" > /dev/null
          docker manifest inspect "${WEB_IMAGE}:${GITHUB_SHA}" > /dev/null

          echo "Both images are available in GHCR."
          echo "Backend: ${API_IMAGE}:${GITHUB_SHA}"
          echo "Frontend: ${WEB_IMAGE}:${GITHUB_SHA}"


  # =========================================================
  # JOB 5: VALIDATE KUBERNETES MANIFESTS
  # =========================================================
  validate-manifests:
    name: 05 - Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: publish-images

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Kubernetes Manifests
        run: |
          echo "Listing Kubernetes manifest files..."
          ls -la kubernetes/

      - name: Check Required Files
        run: |
          echo "Checking required Kubernetes files..."

          test -f kubernetes/namespace.yaml
          test -f kubernetes/backend-deployment.yaml
          test -f kubernetes/backend-service.yaml
          test -f kubernetes/frontend-deployment.yaml
          test -f kubernetes/frontend-service.yaml

          echo "All required manifest files exist."

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      
      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating Kubernetes manifests..."

          docker run --rm \
            -v "${PWD}/kubernetes:/manifests:ro" \
            ghcr.io/yannh/kubeconform:latest \
            -strict -summary /manifests/

          echo "Kubernetes manifest validation completed."


      - name: Display Deployment Images
        run: |
          echo "Backend image:"
          grep 'image:' kubernetes/backend-deployment.yaml

          echo "Frontend image:"
          grep 'image:' kubernetes/frontend-deployment.yaml
