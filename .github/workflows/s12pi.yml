name: CI/CD Learning Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================================================
  # JOB 1: CHECKOUT REPOSITORY
  # =========================================================
  checkout:
    name: Checkout Repository
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Show current working directory
      - name: Show Current Directory
        run: pwd

      # Step 3: List repository contents
      - name: List Repository Contents
        run: ls -la


  # =========================================================
  # JOB 2: DOCKER SETUP AND VERIFICATION
  # =========================================================
  docker-setup:
    name: Docker Setup and Verification
    runs-on: ubuntu-latest
    needs: checkout

    steps:

      # Step 1: Check if Docker is installed.
      # If Docker is missing, install it.
      - name: Check and Install Docker
        run: |
          if command -v docker >/dev/null 2>&1; then
            echo "Docker is already installed."
          else
            echo "Docker is not installed."
            echo "Installing Docker..."

            sudo apt-get update
            sudo apt-get install -y docker.io

            echo "Docker installation completed."
          fi

      # Step 2: Verify Docker installation
      - name: Verify Docker
        run: |
          echo "Checking Docker version..."
          docker --version

      # Step 3: Pull a public image from Docker Hub
      - name: Pull Docker Image
        run: |
          echo "Pulling nginx image from Docker Hub..."
          docker pull nginx:latest

      # Step 4: Tag the Docker image
      - name: Tag Docker Image
        run: |
          echo "Tagging nginx image..."
          docker tag nginx:latest learning-nginx:v1

      # Step 5: List Docker images
      - name: List Docker Images
        run: |
          echo "Listing Docker images available on the runner..."
          docker images