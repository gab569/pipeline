apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-learn-web
  namespace: s11gabriel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-learn-web
  template:
    metadata:
      labels:
        app: k8s-learn-web
    spec:
      containers:
        - name: frontend
          image: ghcr.io/gab569/k8s-learn-web:c74e5f69e0e518fb36d50d5a98b193cf16849e17
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
